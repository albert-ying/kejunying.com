<p><strong><a href="https://www.mittrchina.com/news/detail/15539">MIT Technology Review China</a></strong> <time>26 November 2025</time></p><p>Featuring AI agent-driven aging intervention discovery.</p><blockquote lang="zh-Hans"><p>近期，一支来自美国哈佛大学和美国斯坦福大学等联合团队真的做到了——他们集成 40 余种衰老时钟模型开发了一个名为 ClockBase Agent 的平台，让 AI 在 200 万份人类和小鼠的分子组学数据里“挖宝”，并找出了超过 500 种可能让生物年龄倒退的干预措施。</p><footer>MIT Technology Review China · <time datetime="2025-11-26">26 November 2025</time> · <a href="https://www.mittrchina.com/news/detail/15539">Source</a></footer></blockquote>
