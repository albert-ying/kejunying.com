ref="/papers/biolearn/">A Unified Framework for Systematic Curation and Evaluation of Aging Biomarkers</a></p><p>K Ying, S Paulson, A Eames, A Tyshkovskiy, …, VN Gladyshev</p><p>Nature Aging · 2025</p><p>Presents a comprehensive framework for systematically curating and evaluating aging biomarkers, addressing the challenge of standardizing biological age measurements.</p><p><a href="https://doi.org/10.1038/s43587-025-00987-y">Source</a></p></figure><figure><img alt="A Unified Framework for Systematic Curation and Evaluation of Aging Biomarkers page 1" height="2721" loading="lazy" src="/assets/papers/biolearn/page-001-2048.webp" width="2048"/><figcaption>Page 1 of 23.</figcaption></figure><figure class="publication"><p><a data-room-key="clockbase-agent" data-room-path="/room/papers/clockbase-agent/" href="/papers/clockbase-agent/">Autonomous AI Agents Discover Aging Interventions from Millions of Molecular Profiles</a></p><p>K Ying, A Tyshkovskiy, A Moldakozhayev, H Wang, …, L Cong, A Regev, J Leskovec, T Wyss-Coray, VN Gladyshev</p><p>bioRxiv · 2025 · Preprint</p><p>ClockBase Agent employs specialized AI agents that autonomously reanalyze 43,602 intervention-control comparisons, revealing 500+ interventions that significantly reduce biological age.</p><p><a href="https://doi.org/10.1101/2023.02.28.530532">Source</a></p></figure><figure><img alt="Autonomous AI Agents Discover Aging Interventions from Millions of Molecular Profiles page 1" height="2651" loading="lazy" src="/assets/papers/clockbase-agent/page-001-2048.webp" width="2048"/><figcaption>Page 1 of 57.</figcaption></figure><figure class="publication"><p><a data-room-key="causal-clocks" data-room-path="/room/papers/causal-clocks/" href="/papers/causal-clocks/">Causality-Enriched Epigenetic Age Uncouples Damage and Adaptation</a></p><p>K Ying, H Liu, AE Tarkhov, MC Sadler, AT Lu, M Moqri, …, VN Gladyshev</p><p>Nature Aging • Cover · 2024</p><p>Established a novel framework to introduce causal information into epigenetic clocks, creating DamAge and AdaptAge—clocks that track detrimental and adaptive methylation changes.</p><p><a href="https://doi.org/10.1038/s43587-023-00557-0">Source</a></p></figure><figure><img alt="Causality-Enriched Epigenetic Age Uncouples Damage and Adaptation page 1" height="2721" loading="lazy" src="/assets/papers/causal-clocks/page-001-2048.webp" width="2048"/><figcaption>Page 1 of 29.</figcaption></figure><figure class="publication"><p><a data-room-key="causal-inference-nrg" data-room-path="/room/papers/causal-inference-nrg/" href="/papers/causal-inference-nrg/">Causal Inference for Epigenetic Ageing</a></p><p>K Ying</p><p>Nature Reviews Genetics · 2024</p><p>A perspective on applying causal inference methods to understand the relationship between epigenetic changes and the aging process.</p><p><a href="https://doi.org/10.1038/s41576-024-00799-7">Source</a></p></figure><figure><img alt="Causal Inference for Epigenetic Ageing page 1" height="2721" loading="lazy" src="/assets/papers/causal-inference-nrg/page-001-2048.webp" width="2048"/><figcaption>Page 1 of 1.</figcaption></figure><figure class="publication"><p><a data-room-key="methylgpt" data-room-path="/room/papers/methylgpt/" href="/papers/methylgpt/">MethylGPT: A Foundation Model for the DNA Methylome</a></p><p>K Ying, J Song, H Cui, Y Zhang, S Li, X Chen, …, VN Gladyshev</p><p>bioRxiv · 2024 · Preprint</p><p>MethylGPT learns the grammar of the human DNA methylome, how CpG sites are methylated together, without labels from 169,010 public methylation profiles. One model then reads any of four array platforms and carries what it learned into imputation, age, sex, tissue and aging-clock outputs.</p><p><a href="https://doi.org/10.1101/2024.10.30.621013">Source</a></p></figure><figure><img alt="MethylGPT: A Foundation Model for the DNA Methylome page 1" height="2651" loading="lazy" src="/assets/papers/methylgpt/page-001-2048.webp" width="2048"/><figcaption>Page 1 of 33.</figcaption></figure><figure class="publication"><p><a data-room-key="centenarians" data-room-path="/room/papers/centenarians/" href="/papers/centenarians/">Depletion of Loss-of-function Germline Mutations in Centenarians Reveals Longevity Genes</a></p><p>K Ying, JP Castro, AV Shindyapina, A Tyshkovskiy, M Moqri, LJE Goeminne, …, VN Gladyshev</p><p>Nature Communications · 2024</p><p>Analysis of centenarian genomes reveals depleted loss-of-function mutations in specific genes, identifying genetic variants that contribute to exceptional longevity.</p><p><a href="https://doi.org/10.1038/s41467-024-52967-2">Source</a></p></figure><figure><img alt="Depletion of Loss-of-function Germline Mutations in Centenarians Reveals Longevity Genes page 1" height="2721" loading="lazy" src="/assets/papers/centenarians/page-001-2048.webp" width="2048"/><figcaption>Page 1 of 11.</figcaption></figure><figure class="publication"><p><a data-room-key="research-10" data-room-path="/room/papers/research-10/" href="/papers/research-10/">An Open Competition for Biomarkers of Aging</a></p><p>K Ying, S Paulson, J Reinhard, LPL Camillo, J Trauble, S Jokiel, …, VN Gladyshev</p><p>bioRxiv · 2024 · Preprint</p><p>Featured author line: K Ying, S Paulson, J Reinhard, LP Camillo, ..., VN Gladyshev</p><p>Organized a community-wide competition to benchmark aging biomarkers, establishing standardized evaluation protocols for biological age estimation methods.</p><p><a href="https://doi.org/10.1101/2024.10.29.620782">Source</a></p></figure><figure><img alt="An Open Competition for Biomarkers of Aging page 1" height="2651" loading="lazy" src="/assets/papers/research-10/page-001-2048.webp" width="2048"/><figcaption>Page 1 of 15.</figcaption></figure><figure class="publication"><p><a data-room-key="ageome" data-room-path="/room/papers/ageome/" href="/papers/ageome/">High-dimensional Ageome Representations of Biological Aging across Functional Modules</a></p><p>K Ying, A Tyshkovskiy, Q Chen, E Latorre-Crespo, B Zhang, H Liu, …, VN Gladyshev</p><p>bioRxiv · 2024 · Preprint</p><p>Develops high-dimensional representations of biological aging that capture aging signatures across multiple functional modules including metabolomics, proteomics, and transcriptomics.</p><p><a href="https://doi.org/10.1101/2024.09.17.613599">Source</a></p></figure><figure><img alt="High-dimensional Ageome Representations of Biological Aging across Functional Modules page 1" height="2651" loading="lazy" src="/assets/papers/ageome/page-001-2048.webp" width="2048"/><figcaption>Page 1 of 39.</figcaption></figure><figure class="publication"><p><a data-room-key="research-22" data-room-path="/room/papers/research-22/" href="/papers/research-22/">Genetic and Phenotypic Analysis of the Causal Relationship between Aging and COVID-19</a></p><p>K Ying, R Zhai, TV Pyrkov, AV Shindyapina, M Mariotti, PO Fedichev, X Shen, VN Gladyshev</p><p>Communications Medicine · 2021</p><p>Demonstrates that genetic variation associated with longer lifespan is linked to reduced COVID-19 risk, identifying key aging-related factors in disease susceptibility.</p><p><a href="https://doi.org/10.1038/s43856-021-00033-z">Source</a></p></figure><figure><img alt="Genetic and Phenotypic Analysis of the Causal Relationship between Aging and COVID-19 page 1" height="2692" loading="lazy" src="/assets/papers/research-22/page-001-2048.webp" width="2048"/><figcaption>Page 1 of 15.</figcaption></figure><h2 id="all-publications">All publications</h2><figure class="publication"><p><a data-room-key="healthflux" data-room-path="/room/papers/healthflux/" href="/papers/healthflux/">A world model simulates the latent dynamics of human health</a></p><p>Wang, Z., Zhang, O., Wang, J., Jiang, Y., Ma, Z. C., …, Gladyshev, V. N., Wyss-Coray, T., Ying, K.</p><p>medRxiv · 2026 · Preprint</p></figure><figure class="publication"><p><a data-room-key="clockbase-agent" data-room-path="/room/papers/clockbase-agent/" href="/papers/clockbase-agent/">Autonomous AI Agents Discover Aging Interv
