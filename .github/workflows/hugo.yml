# Publishes the room homepage to GitHub Pages.
# Since 24 November 2026 kejunying.com serves the prebuilt room site in room-site/
# (built in /Users/A.Y/Desktop/Projects/website/kejunying-room, tools/dist-r34/build-dist.py).
# The Hugo source stays in this repository; to publish it again, restore this
# workflow from the commit before the room release.
name: Deploy the room site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload the room site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./room-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
