<p>We expect the longest-lived species to have the most resilient brains. A bowhead whale can live about two centuries and a naked mole-rat outlives other rodents of its size by decades, so we compare their brains with human brains to find protective molecules and cell states.</p><figure><a aria-label="Full-size image: Painting of a bowhead whale, a Greenland shark, a horse, an elephant, a bat and a mouse around a human." href="/assets/lab/tang-species.webp"><img alt="Painting of a bowhead whale, a Greenland shark, a horse, an elephant, a bat and a mouse around a human." data-figure-key="figure-d158403d5491ff45" decoding="async" height="600" loading="lazy" src="/assets/readers/figure-706e94d13061-600.webp" width="600"/></a></figure>
